# helix-deps.yaml — job_seeker
#
# §11.4.31 machine-readable dependency manifest. NOT gitlinks: since 2026-11-24 job_seeker declares no
# nested submodules at all (§11.4.28(C) forbids an owned submodule nesting own-org submodules; cascade
# check C7). Each entry is an own-org dependency located by scripts/resolve_deps.sh in this order:
#   1. env JSK_DEP_<NAME>, 2. the parent umbrella's submodules/<name>, 3. sibling directory ../<dir>
# and `bash scripts/resolve_deps.sh bootstrap` clones missing ones (public https) at the pinned SHA.
# `ref:` is the pinned commit: the resolved checkout's HEAD must contain it. `dir:` is the sibling dir name.
# gates/verify_pins.sh enforces this (and that no gitlink has crept back into the index).
#
# Entries added 2026-11-24 per docs/decisions/0003-catalogue-first-verdicts.md (superseded as to layout by
# docs/decisions/0008-no-nested-gitlinks-resolver.md): containers (§11.4.76), challenges + qa/HelixQA +
# security (§11.4.169). Pins are the exact SHAs proposed in that ADR; containers uses the umbrella's pin
# for parity.
#
# Planned (NOT yet present, so NOT listed as a deps[] entry, since a pin for a dependency that does not
# exist would be false): the third-party jobops service (DaKheera47/job-ops) as a submodule behind an
# adapter. When it is added it gets a real entry here with its exact ref.

schema_version: 1

deps:
  - name: containers
    ssh_url: git@github.com:vasic-digital/containers.git
    ref: "2d18551c6c99e21f4287be5b1d3c927ac3901d07"
    dir: containers
    why: "Canonical Containers Submodule (§11.4.76): runtime auto-detection, compose Up/Down, health, service registry. Go module digital.vasic.containers, consumed by tools/containers via a replace onto .deps/containers."
  - name: challenges
    ssh_url: git@github.com:vasic-digital/challenges.git
    ref: "04d5c31b97f901f0592ed856c48585f40121022f"
    dir: challenges
    why: "Test-execution and reporting foundation required by the §11.4.169 challenges test type; HelixQA (qa) builds on it."
  - name: qa
    ssh_url: git@github.com:vasic-digital/HelixQA.git
    ref: "dc25b8abaa3856cede6d066b7d7ceb8c13d4d310"
    dir: HelixQA
    why: "HelixQA: the anti-bluff QA orchestration framework required by §11.4.169 (helixqa test type) and §11.4.278."
  - name: security
    ssh_url: git@github.com:vasic-digital/security.git
    ref: "0513361e2f9cdfa2c3b1da687a0d66e5eb7c8fd1"
    dir: security
    why: "Security scanning and hardening packages required by the §11.4.169 security test type (T105); also the SSRF guard candidate for T020."

transitive_handling:
  recursive: true
  conflict_resolution: >-
    operator-required. Nested dependencies declared by challenges (containers, Panoptic) and qa
    (Challenges, Containers, DocProcessor, LLMOrchestrator, LLMProvider, LLMsVerifier, security,
    VisionEngine) are NOT resolved here: nothing in job_seeker imports them, and qa expects sibling
    checkouts (replace ../challenges, ../containers) that the sibling layout satisfies with the
    directories at the pins above. They are added by the task that first consumes them, with the
    pin recorded here in the same change.
