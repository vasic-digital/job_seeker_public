# Versioned area classification rules (FR-013, FR-014, FR-019). DATA, not code.
# Matching: text is lower-cased, diacritics folded and punctuation collapsed to single spaces; a token matches
# on whole-word boundaries. Tokens in EN, RU and SR (Latin and Cyrillic) live side by side in the same rule.
# Score per area S = sum over rules of weight x (title_multiplier if the rule hit the title, else 1 if body/tags).
version: 1
title_multiplier: 2
thresholds:
  high_s1: 10        # S1 >= 10 and margin >= 4 -> mapped (high)
  high_margin: 4
  ambiguous_s1: 6    # 6 <= S1 < 10, or S1 >= 6 with margin < 4 -> ambiguous; S1 < 6 -> unmapped
# Specificity precedence: when `winner` reaches min_winner, every `losers` entry is dropped from the ranking.
# winner_hit_in restricts which fields may supply that winning score (empty = any).
precedence:
  - {winner: android-tv,  losers: [android-aosp, android, mobile], min_winner: 6}
  - {winner: android-aosp, losers: [android, mobile], min_winner: 6}
  - {winner: android,     losers: [mobile], min_winner: 6}
  - {winner: react-native, losers: [mobile, web-frontend], min_winner: 6}
  - {winner: flutter,     losers: [mobile], min_winner: 6}
  - {winner: ai-engineering, losers: [go], min_winner: 6, winner_hit_in: [title, tags]}
# A title matching any of these is a non-engineering role: forced unmapped (FR-016), never scored into an area.
non_engineering_title_tokens:
  - recruiter
  - sales manager
  - account executive
  - marketing manager
  - customer support
  - accountant
  - account director
  - account manager
  - designer
  - product design
  - content reviewer
  - operations manager
  - it manager
  - product analytics
  - solutions engineer
  - hr manager
  - office manager
  - рекрутер
  - менеджер по продажам
  - бухгалтер
  - маркетолог
  - специалист поддержки
  - regrut
  - menadzer prodaje
  - racunovodja
  - менаџер продаје
  - рачуноводја
