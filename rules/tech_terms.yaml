# Tech-term dictionary of the posting term extractor (JSK-T164, FR-107). DATA, public terms only. Canonical -> variants;
# every variant is matched as a WHOLE TOKEN SEQUENCE (internal/match/terms.go). case_sensitive: canonical spelling must
# match in case because the lower-case word is ordinary English ("go to market"). Canonical names agree with
# rules/synonyms.yaml (the scoring feature); a unit test fails when the two tables disagree.
schema: tech_terms.v1
case_sensitive:
  - Go
  - Rust
  - Swift
  - C
  - R
  - Make
  - Express
  - Spring
  - Gin
  - Rails
  - Azure
  - Git
